# Run the full test suite on every push and pull request. Tagged releases repeat
# the same gates before any artifact is built or published.
name: test

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # Real PostgreSQL for the PG store suite: without the DSN those tests
    # self-skip, which is exactly the silent gap plan1 LB-02 forbids.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cronova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CRONOVA_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/cronova_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: verify modules
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race ./...
      - name: postgres suite must not skip
        run: |
          out=$(go test -v -count=1 ./internal/store/postgres/ 2>&1)
          echo "$out" | tail -20
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "PostgreSQL store tests skipped — the CI database must be reachable (plan1 LB-02)"; exit 1
          fi
      - name: coverage floor
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 55) { print "coverage " $3 "% is below 55%"; exit 1 } }'
      - name: vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: deployment script syntax
        run: bash -n deploy/*.sh scripts/*.sh
